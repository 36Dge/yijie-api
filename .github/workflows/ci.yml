name: CI
on:
  push:
    branches: [main, staging, develop]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yijie
          POSTGRES_PASSWORD: yijie
          POSTGRES_DB: yijie_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yijie -d yijie_api"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      YIJIE_API_POSTGRES_DSN: postgres://yijie:yijie@localhost:5432/yijie_api?sslmode=disable
      YIJIE_API_TEST_POSTGRES_DSN: postgres://yijie:yijie@localhost:5432/yijie_api?sslmode=disable
      YIJIE_API_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make migrate-up
      - run: make test
      - run: make test-integration
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
